version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.test
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
    volumes:
      - ./auth.db:/app/auth.db
      - ./merged_pref_top50_updated.csv:/app/merged_pref_top50_updated.csv
      - ./logos:/app/logos
    command: uvicorn ai_search_api:app --host 0.0.0.0 --port 8000 --reload
